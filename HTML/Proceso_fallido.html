<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoBaTicket - Sitio oficial de venta de entradas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style_proceso.css">
</head>
</head>
<body>
    <!-- 
        Pantalla que informará si algun proceso que se mandó al php se hizo erroneamente, por ende dará la opción redireccionar al 
        la pantalla anterior con un "javascript:history.back()" 
    -->
    <div class="contenedor-exito">
        <i class='bx bx-check-circle icono-exito'></i>
        <h1 class="titulo-exito">¡Algo falló!</h1>
        <p class="mensaje-exito">Proceso falllido.</p>
        
        
        
        <a href="javascript:history.back()" class="boton-volver">
            <i class='bx bx-home'></i> Volver atras
        </a>
        
    </div>
</body>
</html>

</html>
